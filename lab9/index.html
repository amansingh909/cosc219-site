<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trail Finder — COSC 219 Lab 9</title>

  <!-- Link Bootstrap's CSS here. Use the CDN link from the Lecture 18 slides,
       and check the version is still current. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

  <script type="module" src="main.js"></script>
</head>

<body>

  <!-- A navbar that collapses on small screens.
       You need .navbar, .navbar-toggler and .navbar-collapse, wired with the
       data-bs-* attributes. Bootstrap's JavaScript does the rest. -->
  <nav class="navbar navbar-expand-lg bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Trail Finder</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Home</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>


  <!-- The page content, in a .container.

       A .row with:
         · a search text field   col-12 col-md-6
         · a rating select       col-12 col-md-4
         · a Load button         col-12 col-md-2
       Gutters with g-3, not margins of your own.
       Every control needs a real <label> — form-label is styling, not a label. -->
  <div class="container mt-4">
    <h1>Trail Finder</h1>
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-6">
        <label for="search" class="form-label">Search</label>
        <input type="text" class="form-control" id="search" placeholder="Enter trail name">
      </div>
      <div class="col-12 col-md-4">
        <label for="rating" class="form-label">Rating</label>
        <select class="form-select" id="rating">
          <option value="">Select rating</option>
          <option value="easy">Easy</option>
          <option value="moderate">Moderate</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="col-12 col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" id="loadButton">Load</button>
      </div>
    </div>
    <div id="state-loading" class="d-none">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="state-error" class="d-none">
      <div class="alert alert-danger" role="alert">
        An error occurred while loading trails.
      </div>
    </div>

    <div id="state-empty" class="d-none">
      <p>No trails found.</p>
    </div>

    <div id="state-loaded" class="d-none row row-cols-1 g-3 row-cols-md-2 row-cols-lg-3">

    </div>
  </div>


  <!-- The four state panels. Give each one an id so you can show and hide it,
       and start them all with d-none.

         #state-loading   a .spinner-border, with .visually-hidden text inside
         #state-error     an .alert.alert-danger
         #state-empty     a message
         #state-loaded    the .row that holds the cards, using
                          row-cols-1 row-cols-md-2 row-cols-lg-3 -->



  <!-- Bootstrap's JavaScript bundle goes here, at the end of the body. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
    crossorigin="anonymous"></script>

</body>

</html>
